[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "removebg-migrate"
version = "0.1.0"
description = "Find remove.bg API calls in your code, flag options that won't carry over, and switch to a compatible endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["remove.bg", "background removal", "api", "migration", "transparent png"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://clearbg.org/background-removal-api"

[project.scripts]
removebg-migrate = "removebg_migrate.cli:main"

[tool.setuptools]
packages = ["removebg_migrate"]
